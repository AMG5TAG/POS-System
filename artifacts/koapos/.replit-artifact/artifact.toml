kind = "web"
previewPath = "/"
title = "KoaPOS"
version = "1.0.0"
id = "artifacts/koapos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19141

[services.development]
run = "pnpm --filter @workspace/koapos run dev"

# Not static: Replit routes by path only, so "/" on every domain lands here, and
# server.mjs picks the build by host — the Koastal Kollective website and the
# shop (/shop) on koastal.com.au, the POS otherwise.
# INDEXNOW_SUBMIT=1 lets the website's postbuild ping IndexNow; only this deploy
# build sets it, so local builds never call out to search engines.
[services.production]

[services.production.build]
args = [ "env", "INDEXNOW_SUBMIT=1", "pnpm", "--filter", "@workspace/koapos", "--filter", "@workspace/shop", "--filter", "@workspace/website", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/koapos/server.mjs" ]

[services.production.run.env]
PORT = "19141"

[services.env]
PORT = "19141"
BASE_PATH = "/"
