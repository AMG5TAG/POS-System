kind = "web"
previewPath = "/"
title = "KoaPOS"
version = "1.0.0"
id = "artifacts/koapos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19141

[services.development]
run = "pnpm --filter @workspace/koapos run dev"

# Not static: Replit routes by path only, so "/" on every domain lands here, and
# server.mjs picks the shop's build for the shop domain and the POS's otherwise.
[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/koapos", "--filter", "@workspace/shop", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/koapos/server.mjs" ]

[services.production.run.env]
PORT = "19141"

[services.env]
PORT = "19141"
BASE_PATH = "/"
