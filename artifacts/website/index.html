    <!-- Legacy origin redirect. The canonical origin moved to koastal.com.au
         with the rebrand. This sits first in <head> so it fires on the parsed
         HTML, before the stylesheet, fonts or the app bundle are fetched — the
         hop then costs one HTML response rather than a full page boot, and it
         still works if the bundle fails to load.

         A 301 in front of the old domain, set at the DNS/host layer, is the
         real fix: this is a 200 + client hop, which Google treats as weaker
         than a permanent redirect. Every page also carries a canonical to
         koastal.com.au, which is what actually consolidates the ranking.

         If koastal.com.au ever stops being the live origin, empty this list. -->
    <script>
      (function () {
        try {
          var LEGACY = ["koastalkomputers.com.au", "www.koastalkomputers.com.au"];
          if (LEGACY.indexOf(location.hostname) === -1) return;
          location.replace(
            "https://koastal.com.au" + location.pathname + location.search + location.hash
          );
        } catch (e) {}
      })();
    </script>
