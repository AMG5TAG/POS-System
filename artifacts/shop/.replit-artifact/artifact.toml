kind = "web"
previewPath = "/shop/"
title = "Koastal Shop"
version = "1.0.0"
id = "artifacts/shop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/shop" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/shop run dev"

# Replit routes by path, so in production every /shop request on every domain
# comes HERE, not to the koapos artifact — and with no production service it was
# a bare 500. It runs the same host-aware server as koapos (server.mjs), which
# serves the shop under /shop on koastal.com.au. This is the only production
# build of the shop (koapos's build leaves it out).
[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/shop", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/koapos/server.mjs" ]

[services.production.run.env]
PORT = "19161"

[services.env]
PORT = "19161"
BASE_PATH = "/shop/"
