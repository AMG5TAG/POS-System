kind = "web"
previewPath = "/shop/"
title = "Koastal Shop"
version = "1.0.0"
id = "artifacts/shop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/shop" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shop", "run", "build" ]
publicDir = "artifacts/shop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19161"
BASE_PATH = "/shop/"
