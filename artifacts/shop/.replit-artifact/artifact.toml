kind = "web"
previewPath = "/shop/"
title = "Koastal Shop"
version = "1.0.0"
id = "artifacts/shop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/shop" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/shop run dev"

# No production service: in production the shop is served at the root of the
# shop domain by artifacts/koapos/server.mjs. /shop is the development preview.

[services.env]
PORT = "19161"
BASE_PATH = "/shop/"
