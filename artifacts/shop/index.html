<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koastal Kollective — Shop</title>
    <meta name="description" content="Shop online with Koastal Kollective — computers, repairs, accessories and services on the Central Coast." />
    <!--share-->
    <!-- Link previews. Every shop page shows Share.png (object storage, served
         by the API); a product page's block is rewritten by
         artifacts/koapos/share-meta.mjs to lead with the product's own photo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koastal Kollective" />
    <meta property="og:title" content="Koastal Kollective — Shop" />
    <meta property="og:description" content="Shop online with Koastal Kollective — computers, repairs, accessories and services on the Central Coast." />
    <meta property="og:image" content="https://koastal.com.au/api/share-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://koastal.com.au/api/share-image.png" />
    <!--/share-->
    <meta name="theme-color" content="#007b7d" />
    <!-- The website's own icons (artifacts/website/public/images), named from the
         site root: the shop is served under /shop on the same domain, so one
         copy serves both and they can't drift apart. -->
    <link rel="icon" type="image/png" sizes="180x180" href="/images/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.png" />
    <!-- The site-wide menu (@workspace/site-nav) is set in the website's typeface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
    <!-- The website's theme choice (kk-theme, same origin), applied before the
         first paint so a dark-mode visitor never sees a white flash. Mirrors
         applyTheme in lib/site-nav/src/theme.tsx. -->
    <script>try{var m=localStorage.getItem("kk-theme")||"system";if(m==="dark"||(m==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
