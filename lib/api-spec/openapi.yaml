  # ── Transactions ──────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          description: ISO date string (YYYY-MM-DD) — filter transactions on or after this date
          schema:
            type: string
        - name: to
          in: query
          description: ISO date string (YYYY-MM-DD) — filter transactions on or before this date
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new transaction (complete a sale)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "422":
          description: Discounts exceed cart subtotal — total would be negative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      parameters:
        - name: id
          in: path
          required: true
