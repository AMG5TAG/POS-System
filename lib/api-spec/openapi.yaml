components:
  schemas:
    # ── SMS templates & campaigns ─────────────────────────────────────────────
    SmsTemplate:
      type: object
      required: [id, merchantId, templateId, name, category, body, createdAt, updatedAt]
      properties:
        id: { type: integer }
        merchantId: { type: integer }
        templateId: { type: string }
        name: { type: string }
        category: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SmsTemplateInput:
      type: object
      required: [templateId, name]
      properties:
        templateId: { type: string }
        name: { type: string }
        category: { type: string }
        body: { type: string }

    SmsTemplateListResponse:
