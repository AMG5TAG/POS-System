      type: object
      required: [items]
      properties:
        processedBy: { type: string }
        items:
          type: array
          items:
            type: object
            required: [poItemId, quantityReceiving]
            properties:
              poItemId: { type: integer }
              quantityReceiving: { type: integer }
    PurchaseOrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        productName: { type: string }
        quantity: { type: integer }
        received: { type: integer }
        unitCost: { type: number }
        notes: { type: string, nullable: true }
        tracksSerial: { type: boolean }
    PurchaseOrder:
      type: object
      required: [id, poNumber, status, orderDate, totalCost, createdAt]
      properties:
        id: { type: integer }
        supplierId: { type: integer, nullable: true }
        supplierName: { type: string, nullable: true }
        poNumber: { type: string }
        orderNumber: { type: string, nullable: true }
        status: { type: string }
        orderDate: { type: string }
        expectedDate: { type: string, nullable: true }
        receivedDate: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        totalCost: { type: number }
        deliveryCharge: { type: number }
        deliveryTaxMode: { type: string }
        amountPaid: { type: number }
        paymentStatus: { type: string }
        paymentMethod: { type: string, nullable: true }
        paidAt: { type: string, nullable: true }
        invoiceUrls:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/POReceiptLog"
        createdAt: { type: string }
    PurchaseOrderInput:
      type: object
      required: [orderDate]
      properties:
        supplierId: { type: integer }
        poNumber: { type: string }
        poNumberPrefix: { type: string }
        poNumberDigits: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        orderDate: { type: string }
        expectedDate: { type: string }
        receivedDate: { type: string }
        notes: { type: string }
        totalCost: { type: number }
        deliveryCharge: { type: number }
        deliveryTaxMode: { type: string }
        # Optional supplier payment recorded at creation. Set payFull to settle
        # the order at the server-computed total (avoids client/server GST rounding
        # drift); otherwise paymentAmount records a partial payment. paymentMethod
        # labels how the supplier was paid (bank_transfer, card, cash, …).
        payFull: { type: boolean }
        paymentAmount: { type: number }
        paymentMethod: { type: string }
        invoiceUrls:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

