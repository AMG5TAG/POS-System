        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated quote (status accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Quote not found
        "409":
          description: Quote can no longer be approved

  /quotes/{id}/event:
