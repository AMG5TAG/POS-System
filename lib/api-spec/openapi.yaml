          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}/void:
    post:
      operationId: voidTransaction
      tags: [transactions]
      summary: Void a transaction (cancel a mistaken sale)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: ["string", "null"] }
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}/modify:
    post:
      operationId: modifyCompletedSale
      tags: [transactions]
      summary: >-
        Amend a completed sale in limited ways — add free ($0) products, link a
        customer, and/or link an appointment or service job. Never changes the
        money collected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCompletedSaleInput"
      responses:
        "200":
          description: Modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "409":
          description: Sale is not in a state that can be modified (only completed sales)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

