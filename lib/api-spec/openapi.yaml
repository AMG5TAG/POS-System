      responses:
        "200":
          description: Mappings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /integrations/contacts/sync:
    post:
      operationId: syncIntegrationContacts
      tags: [integrations]
      summary: Sync KoaPOS customers to Google Contacts or Microsoft Contacts
      description: |
        Pushes all KoaPOS customers to the requested contact platform.
        When `includeNotes` is true, CRM notes are mapped to each platform's
        native notes field (Google → biographies, Microsoft → personalNotes).
        Per-contact failures are counted and returned without aborting the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncContactsInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncContactsResult"
        "400":
          description: Invalid provider
        "401":
          description: Provider not connected

  /integrations/customer-files-cloud:
    get:
      operationId: getCustomerFilesCloudSettings
      tags: [integrations]
      summary: Get the "save all customer files to the cloud" preference
      description: |
        Returns whether customer file uploads are mirrored to a folder on a
        connected cloud storage provider, along with the supported providers.
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerFilesCloudSettings"
    put:
      operationId: updateCustomerFilesCloudSettings
      tags: [integrations]
      summary: Update the "save all customer files to the cloud" preference
      description: |
        When `enabled` is true, a supported `storageKey` and a non-empty `folder`
        are required. Once enabled, every file uploaded to a customer is also
        pushed to that folder on the chosen cloud storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerFilesCloudSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerFilesCloudSettingsInput"
        "400":
