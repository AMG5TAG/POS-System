  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, yesterday, week, month, year]
        - name: monthMode
          in: query
          description: How the "month" period is computed. rolling30 = last 30 days (default); calendar_mtd = 1st of the current month to now.
          schema:
            type: string
            enum: [rolling30, calendar_mtd]
        - name: yearMode
          in: query
          description: How the "year" period is computed. financial = current Australian financial year, 1 Jul → now (default); rolling365 = last 365 days.
          schema:
            type: string
            enum: [financial, rolling365]
        - name: compare
          in: query
          description: When true, also return the previous equivalent period's headline totals under `previous`.
          schema:
            type: boolean
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

