    # ── Transactions ─────────────────────────────────────────────────────────
    TransactionItem:
      type: object
      required: [productId, productName, quantity, unitPrice, totalPrice]
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
        totalPrice:
          type: number
        taxAmount:
          type: number
        discount:
          type: number
        giftCardIssue:
          type: boolean
          description: >-
            When true, this item represents a gift card being sold. The server
            creates and activates the card atomically inside the same DB
            transaction as the sale.
        giftCardNumber:
          type: string
          description: >-
            Card number for the issued gift card. The client may provide a
            pre-generated code; if omitted or blank, the server generates one.
            Populated in the response for every giftCardIssue item.
        digitalCodes:
          type: array
          items:
            type: string
          description: >-
            Digital codes assigned to this line item during checkout. Populated
            in the response for products of type "digital_code" with unassigned
            codes available in inventory. One code per unit sold.

    Transaction:
      type: object
      required: [id, merchantId, status, subtotal, taxTotal, total, paymentMethod, createdAt, items]
      properties:
        id:
          type: integer
        merchantId:
          type: integer
        customerId:
          type: ["integer", "null"]
        customer:
          $ref: "#/components/schemas/Customer"
        staffId:
          type: ["integer", "null"]
        receiptNumber:
          type: string
        status:
          type: string
          enum: [completed, refunded, partial_refund, voided]
        subtotal:
          type: number
        taxTotal:
          type: number
        discountTotal:
          type: number
        total:
          type: number
        paymentMethod:
          type: string
          enum: [cash, card, eftpos, split, voucher, other, direct_deposit, store_credit, laybuy, loyalty, zip, afterpay, klarna]
        surchargeAmount:
          type: number
          description: >-
            Customer-facing surcharge added to the total at checkout when the
            chosen payment method passes its acceptance cost on to the customer.
            0 when the method has no surcharge or the merchant absorbs the cost.
        amountTendered:
          type: ["number", "null"]
        changeDue:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        loyaltyEarned:
          type: ["number", "null"]
        discountCapped:
          type: ["boolean", "null"]
          description: >-
            True when the cashier attempted a discount exceeding their role
            limit and it was clamped to the maximum allowed. Managers can use
            this to review override attempts.
        discountPct:
          type: ["number", "null"]
          description: >-
            The overall cart discount percentage when the cashier entered the
            discount as a percentage (e.g. 10 for 10%). Null when no overall
            discount was applied or when it was a dollar-amount discount. Used
            to render "10% discount" on reprinted receipts instead of "Discount".
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        issuedGiftCards:
          type: array
          description: >-
            Gift cards activated as part of this transaction.
            Present when the sale included one or more giftCardIssue line items.
          items:
            type: object
            required: [cardNumber, balance]
            properties:
              cardNumber:
                type: string
              balance:
                type: number
        createdAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [items, paymentMethod, subtotal, taxTotal, total]
      properties:
        customerId:
          type: integer
        staffId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        paymentMethod:
          type: string
          enum: [cash, card, eftpos, split, voucher, other, direct_deposit, store_credit, laybuy, loyalty, zip, afterpay, klarna]
        subtotal:
          type: number
        taxTotal:
          type: number
        discountTotal:
          type: number
        total:
          type: number
        amountTendered:
          type: number
        changeDue:
          type: number
        notes:
          type: string
        loyaltyEarned:
          type: number
        receiptNumber:
          type: string
        idempotencyKey:
          type: string
          description: >-
            Optional client-generated key. Retrying a create with the same key
            returns the original transaction instead of recording a duplicate.
        requestedDiscountTotal:
          type: number
          description: >-
            The total dollar discount the cashier originally attempted to apply
            before any role-limit clamping. When this exceeds discountTotal by
            more than rounding noise the server infers a clamp occurred and
            persists discountCapped on the saved record.
        discountPct:
          type: number
          description: >-
            When the overall cart discount was entered as a percentage, the
            numeric percentage value (e.g. 10 for 10%). Omit or leave undefined
            for dollar-amount discounts. Stored on the transaction so reprinted
            receipts can render "10% discount" instead of the plain "Discount".
        giftCardPayment:
          type: object
          description: >-
            When the sale is settled wholly or partly with a gift card, debit the
            card atomically as part of recording the transaction.
          required: [cardId, amount]
          properties:
            cardId:
              type: integer
            amount:
              type: number
        paidAt:
          type: string
          description: >-
            Optional accounting date for the sale. The transaction's createdAt —
            and therefore the sale date used by every revenue report
            (view_daily_sales_summary, payment-method breakdown) — is set to this
            date instead of "now". Used for tenders that actually landed on an
            earlier day, e.g. a direct deposit / bank transfer recorded at the
            register after it cleared. Accepts a plain date (YYYY-MM-DD) or an ISO
            date-time; must not be in the future.

    ModifyCompletedSaleItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          description: >-
            Catalog product id to add as a free line. Use 0 for a custom
            free line (supply productName). The line is always recorded at $0
            regardless of the product's catalog price.
        productName:
          type: string
          description: Name for a custom free line (productId 0). Ignored for catalog products.
        quantity:
          type: integer
          minimum: 1

    ModifyCompletedSaleInput:
      type: object
      description: >-
        Limited post-sale amendments to a completed sale. Every field is
        optional; only the fields present are applied. Added items are always
        recorded at $0 (complimentary) so the sale total never changes.
      properties:
        customerId:
          type: ["integer", "null"]
          description: >-
            Link (or change) the customer on the sale. Pass null to detach the
            current customer. Omit to leave the customer unchanged.
        addItems:
          type: array
          description: Free products to add to the sale; each is forced to $0.
          items:
            $ref: "#/components/schemas/ModifyCompletedSaleItem"
        serviceJobNumber:
          type: string
          description: >-
            Link the sale to a service job by its job number. The job is marked
            completed and a reference is appended to the sale notes.
        appointmentId:
          type: integer
          description: >-
            Link the sale to an appointment by id. The appointment is marked
            completed and a reference is appended to the sale notes.

    RefundInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        amount:
          type: number

    TransactionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer

