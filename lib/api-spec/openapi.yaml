    # ── Service Settings ──────────────────────────────────────────────────────
    # Booleans toggling each section of the service job menu. All optional;
    # an omitted key defaults to true (section visible).
    ServiceSettings:
      type: object
      required:
        [showPartsLabour, showApprovalDeposit, showDiagnostics, showWarranty,
         showTechnicianTime, showSignOff, showShipping, showNotes,
         repairWarrantyDays, reworkWarrantyDays]
      properties:
        showPartsLabour:    { type: boolean }
        showApprovalDeposit: { type: boolean }
        showDiagnostics:    { type: boolean }
        showWarranty:       { type: boolean }
        showTechnicianTime: { type: boolean }
        showSignOff:        { type: boolean }
        showShipping:       { type: boolean }
        showNotes:          { type: boolean }
        repairWarrantyDays: { type: integer, minimum: 0, description: "Default repair warranty period (days) pre-filled on new service jobs." }
        reworkWarrantyDays: { type: integer, minimum: 0, description: "Default warranty period (days) applied to no-charge rework jobs." }
    ServiceSettingsInput:
      type: object
      required:
        [showPartsLabour, showApprovalDeposit, showDiagnostics, showWarranty,
         showTechnicianTime, showSignOff, showShipping, showNotes]
      properties:
        showPartsLabour:    { type: boolean }
        showApprovalDeposit: { type: boolean }
        showDiagnostics:    { type: boolean }
        showWarranty:       { type: boolean }
        showTechnicianTime: { type: boolean }
        showSignOff:        { type: boolean }
        showShipping:       { type: boolean }
        showNotes:          { type: boolean }
        repairWarrantyDays: { type: integer, minimum: 0 }
        reworkWarrantyDays: { type: integer, minimum: 0 }

    InvoiceSettings:
      type: object
      required:
        [defaultDueDays, numberPrefix, defaultNotes, defaultTerms,
         reminderEnabled, reminderDaysBefore,
         overdueEnabled, overdueDaysAfter, overdueRepeatDays, lateFeeEnabled, lateFeePercent,
         surchargeEnabled, surchargePercent, surchargeAfterReminders,
         debtCollectionEnabled, debtCollectionThreshold,
         autoSendOnCreate, defaultSendMethod, attachPdf, bccBusinessEmail, emailSubject, emailMessage]
      properties:
        # ── Defaults ──
        defaultDueDays:     { type: integer, minimum: 0, description: "Days from issue date used to pre-fill a new invoice's due date. 0 = due on receipt." }
        numberPrefix:       { type: string, description: "Prefix shown before invoice numbers (e.g. INV-)." }
        defaultNotes:       { type: string, description: "Notes pre-filled on every new invoice and printed on the PDF." }
        defaultTerms:       { type: string, description: "Payment terms / conditions printed in the invoice footer." }
        # ── Payment reminders ──
        reminderEnabled:    { type: boolean, description: "Email the customer a reminder before the invoice falls due." }
        reminderDaysBefore: { type: integer, minimum: 0, description: "How many days before the due date the reminder is sent." }
        # ── Overdue notifications ──
        overdueEnabled:     { type: boolean, description: "Email the customer when an invoice becomes overdue." }
        overdueDaysAfter:   { type: integer, minimum: 0, description: "Days after the due date before the first overdue notice is sent." }
        overdueRepeatDays:  { type: integer, minimum: 0, description: "Repeat the overdue notice every N days. 0 = send once only." }
        lateFeeEnabled:     { type: boolean, description: "Apply a one-time late fee to an invoice as soon as it becomes overdue." }
        lateFeePercent:     { type: number, minimum: 0, description: "Late fee as a percentage of the invoice total." }
        surchargeEnabled:   { type: boolean, description: "Apply an additional one-time surcharge once an invoice has had a set number of overdue reminders." }
        surchargePercent:   { type: number, minimum: 0, description: "Surcharge as a percentage of the invoice total, added after the overdue-reminder threshold is reached." }
        surchargeAfterReminders: { type: integer, minimum: 0, description: "Number of overdue reminders that must be sent before the surcharge is applied. 0 = apply as soon as overdue." }
        debtCollectionEnabled:   { type: boolean, description: "Email a debt-collection escalation notice to a customer once they accumulate too many overdue invoices." }
        debtCollectionThreshold: { type: integer, minimum: 1, description: "Number of overdue invoices a single customer must reach before the debt-collection email is sent." }
        # ── Sending ──
        autoSendOnCreate:   { type: boolean, description: "Automatically send the invoice to the customer as soon as it is created." }
        defaultSendMethod:  { type: string, enum: [email, sms, both], description: "Default delivery channel pre-selected when sending an invoice." }
        attachPdf:          { type: boolean, description: "Attach a PDF copy of the invoice to outgoing emails." }
        bccBusinessEmail:   { type: boolean, description: "Send a blind copy of every invoice email to the business email address." }
        emailSubject:       { type: string, description: "Default email subject. Supports {number} and {business} placeholders." }
        emailMessage:       { type: string, description: "Default email body. Supports {number}, {business}, {total} and {dueDate} placeholders." }

    InvoiceSettingsInput:
      type: object
      properties:
        defaultDueDays:     { type: integer, minimum: 0 }
        numberPrefix:       { type: string }
        defaultNotes:       { type: string }
        defaultTerms:       { type: string }
        reminderEnabled:    { type: boolean }
        reminderDaysBefore: { type: integer, minimum: 0 }
        overdueEnabled:     { type: boolean }
        overdueDaysAfter:   { type: integer, minimum: 0 }
        overdueRepeatDays:  { type: integer, minimum: 0 }
        lateFeeEnabled:     { type: boolean }
        lateFeePercent:     { type: number, minimum: 0 }
        surchargeEnabled:   { type: boolean }
        surchargePercent:   { type: number, minimum: 0 }
        surchargeAfterReminders: { type: integer, minimum: 0 }
        debtCollectionEnabled:   { type: boolean }
        debtCollectionThreshold: { type: integer, minimum: 1 }
        autoSendOnCreate:   { type: boolean }
        defaultSendMethod:  { type: string, enum: [email, sms, both] }
        attachPdf:          { type: boolean }
        bccBusinessEmail:   { type: boolean }
        emailSubject:       { type: string }
        emailMessage:       { type: string }

    # ── Cash Drawer ──────────────────────────────────────────────────────────
    CashDrawerEntry:
      type: object
      required: [id, type, amount, shiftDate, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        amount: { type: number }
