        id:          { type: integer }
        merchantId:  { type: integer }
        title:       { type: string }
        content:     { type: string }
        isImportant: { type: boolean }
        isPinned:    { type: boolean }
        visibleTo:   { type: string }
        createdBy:   { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    StaffNoteInput:
      type: object
      required: [title, content]
      properties:
        title:       { type: string }
        content:     { type: string }
        isImportant: { type: boolean }
        isPinned:    { type: boolean }
        visibleTo:   { type: string }
        createdBy:   { type: string }

    StaffNoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffNoteItem" }

    BusinessProfile:
      type: object
      properties:
        abn:            { type: string }
        tagline:        { type: string }
        description:    { type: string }
        openingDate:    { type: string }
        categories:     { type: array, items: { type: string } }
        logo:           { type: string }
        brandFont:      { type: string }
        brandColors:    { type: array, items: { type: string } }
        bgColors:       { type: array, items: { type: string } }
        textColors:     { type: array, items: { type: string } }
        contactEmail:   { type: string }
        website:        { type: string }
        state:          { type: string }
        postcode:       { type: string }
        openingHours:   { type: object }
        paymentTypes:   { type: array, items: { type: string } }
        socialLinks:    { type: object }
        customLinks:    { type: array, items: { type: object } }
        updatedAt:      { type: string, format: date-time }

    BusinessProfileInput:
      type: object
      properties:
        abn:            { type: string }
        tagline:        { type: string }
        description:    { type: string }
        openingDate:    { type: string }
        categories:     { type: array, items: { type: string } }
        logo:           { type: string }
        brandFont:      { type: string }
        brandColors:    { type: array, items: { type: string } }
        bgColors:       { type: array, items: { type: string } }
        textColors:     { type: array, items: { type: string } }
        contactEmail:   { type: string }
        website:        { type: string }
        state:          { type: string }
        postcode:       { type: string }
        openingHours:   { type: object }
        paymentTypes:   { type: array, items: { type: string } }
        socialLinks:    { type: object }
        customLinks:    { type: array, items: { type: object } }

    CustomerSettings:
      type: object
      properties:
        groups:                  { type: array, items: { type: object } }
        requiredFields:          { type: object }
        defaultGroup:            { type: string }
        loyaltyPointsPerDollar:  { type: number }
        enableLoyalty:           { type: boolean }
        weeklyDigestOptIn:       { type: boolean }
        weeklyDigestSendDay:     { type: integer, minimum: 0, maximum: 6, description: "Day of week to send digest (0=Sunday … 6=Saturday)" }
        defaultCustomerImageUrl: { type: string, description: "Fallback avatar shown for customers without their own photo. Uploaded image or external URL." }
        updatedAt:               { type: string, format: date-time }

    CustomerSettingsInput:
      type: object
      properties:
        groups:                  { type: array, items: { type: object } }
        requiredFields:          { type: object }
        defaultGroup:            { type: string }
        loyaltyPointsPerDollar:  { type: number }
        enableLoyalty:           { type: boolean }
        weeklyDigestOptIn:       { type: boolean }
        weeklyDigestSendDay:     { type: integer, minimum: 0, maximum: 6, description: "Day of week to send digest (0=Sunday … 6=Saturday)" }
        defaultCustomerImageUrl: { type: string }

    StickerTemplate:
      type: object
      required: [id, name, typeId, sizeId, fields, createdAt, updatedAt]
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: string }
        typeId:      { type: string }
        sizeId:      { type: string }
        fields:      { type: object }
        isDefault:   { type: boolean }
        createdAt:   { type: number }
        updatedAt:   { type: number }

    StickerTemplateInput:
      type: object
      required: [name, typeId, sizeId, fields]
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: string }
        typeId:      { type: string }
        sizeId:      { type: string }
        fields:      { type: object }
        isDefault:   { type: boolean }

    StickerTemplateUpdateInput:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }
        typeId:      { type: string }
        sizeId:      { type: string }
        fields:      { type: object }
        isDefault:   { type: boolean }

    DuplicateBucket:
      type: object
      required: [bucketKey, matchType, customers, totalTransactions, totalSpent, suggestedPrimaryId]
      properties:
        bucketKey:          { type: string }
        matchType:          { type: string, enum: [phone, name, both] }
        customers:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        totalTransactions:  { type: integer }
        totalSpent:         { type: number }
        suggestedPrimaryId: { type: integer }

    BulkMergePreviewResponse:
      type: object
      required: [buckets, scannedTotal]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/DuplicateBucket" }
        scannedTotal: { type: integer }

    BulkExecuteCluster:
      type: object
      required: [primaryId, secondaryIds]
      properties:
        primaryId: { type: integer }
        secondaryIds:
          type: array
          items: { type: integer }

    BulkExecuteMergeBody:
      type: object
      required: [clusters]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/BulkExecuteCluster" }

    BulkMergeClusterResult:
      type: object
      required: [primaryId, success, merged]
      properties:
        primaryId: { type: integer }
        success:   { type: boolean }
        merged:    { type: integer }
        error:     { type: string }

    BulkMergeResult:
      type: object
      required: [processed, succeeded, failed, results]
      properties:
        processed: { type: integer }
        succeeded: { type: integer }
        failed:    { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkMergeClusterResult" }

    ReferralDigestSendResult:
      type: object
      required: [sent, email]
      properties:
        sent:  { type: boolean }
        email: { type: string }

    RosterShiftItem:
      type: object
      required: [id, merchantId, shiftId, staffId, date, startTime, endTime, note, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        merchantId:  { type: integer }
        shiftId:     { type: string }
        staffId:     { type: string }
        date:        { type: string }
        startTime:   { type: string }
        endTime:     { type: string }
        note:        { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    RosterShiftInput:
      type: object
      required: [shiftId, staffId, date, startTime, endTime]
      properties:
        shiftId:   { type: string }
        staffId:   { type: string }
        date:      { type: string }
        startTime: { type: string }
        endTime:   { type: string }
        note:      { type: string }

    RosterShiftListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RosterShiftItem" }
        total: { type: integer }

    LeaveRequestItem:
      type: object
      required: [id, merchantId, requestId, staffId, staffName, type, startDate, endDate, reason, status, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        merchantId:  { type: integer }
        requestId:   { type: string }
        staffId:     { type: string }
        staffName:   { type: string }
        type:        { type: string }
        startDate:   { type: string }
        endDate:     { type: string }
        reason:      { type: string }
        status:      { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    LeaveRequestInput:
      type: object
      required: [requestId, staffId, staffName, type, startDate, endDate]
      properties:
        requestId:  { type: string }
        staffId:    { type: string }
        staffName:  { type: string }
        type:       { type: string }
        startDate:  { type: string }
        endDate:    { type: string }
        reason:     { type: string }
        status:     { type: string }

    LeaveRequestUpdateInput:
      type: object
      required: [status]
      properties:
        status: { type: string }

    LeaveRequestListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeaveRequestItem" }
        total: { type: integer }

    AppleOAuthCallbackBody:
      type: object
      properties:
        code:     { type: string, description: "Authorization code issued by Apple" }
        id_token: { type: string, description: "Signed JWT containing the authenticated user's identity claims (sub, email)" }
        state:    { type: string, description: "Opaque value passed in the start URL; carries the merchantId" }
        user:     { type: string, description: "JSON-encoded name object sent by Apple on the first authorization only" }
        error:    { type: string, description: "Set by Apple when the user cancels or an error occurs" }

    # ── Auth / Password reset ─────────────────────────────────────────────────
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:       { type: string }
        newPassword: { type: string, minLength: 8 }

    # ── Auth / Credentials ───────────────────────────────────────────────────
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:     { type: string, minLength: 8 }

    ChangeEmailInput:
      type: object
      required: [currentPassword, newEmail]
      properties:
        currentPassword: { type: string }
        newEmail:        { type: string, format: email }

    FeedbackAttachment:
      type: object
      required: [name, data, mimeType]
      properties:
        name:     { type: string }
        data:     { type: string, description: Base64-encoded file content }
        mimeType: { type: string }

    FeedbackInput:
      type: object
      required: [type, title, description]
      properties:
        type:        { type: string, enum: [bug, feature] }
        title:       { type: string }
        description: { type: string }
        steps:       { type: string }
        appVersion:  { type: string }
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackAttachment"

    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    AccountLockStatus:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
          description: Whether the account is currently locked out
        retryAfter:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the lockout expires (only present when locked)
        isAnomalyHold:
          type: boolean
          description: When true the lock was triggered by suspicious multi-IP activity rather than simple brute-force

    UnlockAccountInput:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          description: The owner's current password (required as a second-factor confirmation)

    VaultStatus:
      type: object
      required: [total, current, pendingRotation, invalid, hasPreviousKey]
      properties:
        total:           { type: integer }
        current:         { type: integer }
        pendingRotation: { type: integer }
        invalid:         { type: integer }
        hasPreviousKey:  { type: boolean }

    SignatureSaveInput:
      type: object
      required: [signature]
      properties:
        signature: { type: string, description: "Base64 image data URL (data:image/...)" }
        jobId:     { type: integer }

    SignatureSaveResult:
      type: object
      required: [success, savedTo]
      properties:
        success: { type: boolean }
        savedTo: { type: string }
        jobId:   { type: integer, nullable: true }
        id:      { type: string, nullable: true }

    # ── Integrations ─────────────────────────────────────────────────────────
    IntegrationStatus:
      type: object
      required: [key, label, section, category, description, authType, connected, enabled]
      properties:
        key:             { type: string }
        label:           { type: string }
        section:         { type: string }
        category:        { type: string }
        description:     { type: string }
        authType:        { type: string, enum: [oauth, credentials] }
        connected:       { type: boolean }
        enabled:         { type: boolean }
        connectedAt:     { type: string, format: date-time, nullable: true }
        oauthConfigured: { type: boolean }

    IntegrationConnectInput:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties: { type: string }
          description: Credential key/value pairs for non-OAuth integrations

    # ── Invoices ─────────────────────────────────────────────────────────────
    InvoiceLineItem:
      type: object
      required: [description, quantity, unitPrice, taxRate]
      properties:
        description: { type: string }
        quantity:    { type: number, minimum: 0.0001 }
        unitPrice:   { type: number, minimum: 0 }
        taxRate:     { type: number, minimum: 0, maximum: 100 }
        # Optional product linkage + cost snapshot so invoice profit (COGS) can
        # be derived the same way POS line items are.
        productId:   { type: integer, nullable: true }
        costPrice:   { type: number, minimum: 0, nullable: true }

    InvoiceDiscountInput:
      type: object
      required: [type, value]
      properties:
        type:  { type: string, enum: [fixed, percent] }
        value: { type: number }

    InvoiceEvent:
      type: object
      required: [type, timestamp]
      properties:
        # Stable id stamped on payment events so a payment can be targeted for
        # reversal/correction. Older events may not carry one.
        id:             { type: string, nullable: true }
        type:           { type: string }
        timestamp:      { type: string, format: date-time }
        detail:         { type: string, nullable: true }
        method:         { type: string, nullable: true }
        # Per-leg payment amount. One payment event is recorded per method, so a
        # split payment produces several events whose amounts sum to the payment.
        # Reversal events carry a negative amount.
        amount:         { type: number, nullable: true }
        # For a payment-reversal event: the id of the payment event it reverses.
        reverses:       { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }

    # A single planned instalment on an invoice's payment schedule. Coverage
    # (paid / partial / due) is derived from the invoice's amountPaid, not stored
    # per instalment.
    InvoiceInstalment:
      type: object
      required: [amount]
      properties:
        label:   { type: string, nullable: true }
        amount:  { type: number, minimum: 0 }
        dueDate: { type: string, format: date-time, nullable: true }

    # A single payment leg — one method and the amount tendered on it. Used to
    # express split payments (multiple methods settling one payment) on both
    # invoices and laybys.
    PaymentLeg:
      type: object
      required: [method, amount]
      properties:
        method: { type: string }
        amount: { type: number, minimum: 0 }

    Invoice:
      type: object
      required: [id, merchantId, invoiceNumber, status, subtotal, taxTotal, total, amountPaid, items, events, isRecurring, createdAt, updatedAt]
      properties:
        id:                   { type: integer }
        merchantId:           { type: integer }
        customerId:           { type: integer, nullable: true }
        invoiceNumber:        { type: string }
        status:               { type: string, enum: [draft, sent, partial, paid, overdue, cancelled] }
        subtotal:             { type: number }
        taxTotal:             { type: number }
        total:                { type: number }
        amountPaid:           { type: number }
        discountType:         { type: string, nullable: true }
        discountValue:        { type: number, nullable: true }
        discountTotal:        { type: number, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLineItem" }
        events:
          type: array
          items: { $ref: "#/components/schemas/InvoiceEvent" }
        paymentSchedule:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InvoiceInstalment" }
        notes:                { type: string, nullable: true }
        dueDate:              { type: string, format: date-time, nullable: true }
        paidAt:               { type: string, format: date-time, nullable: true }
        viewedAt:             { type: string, format: date-time, nullable: true }
        isRecurring:          { type: boolean }
        recurringFrequency:   { type: string, nullable: true }
        recurringOccurrences: { type: integer, nullable: true }
        recurringStartDate:   { type: string, format: date-time, nullable: true }
        nextSendDate:         { type: string, format: date-time, nullable: true }
        customerName:         { type: string, nullable: true }
        customerEmail:        { type: string, nullable: true }
        customerPhone:        { type: string, nullable: true }
        customerAddress:      { type: string, nullable: true }
        customerCompany:      { type: string, nullable: true }
        createdAt:            { type: string, format: date-time }
        updatedAt:            { type: string, format: date-time }

    InvoiceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        total: { type: integer }

    InvoiceRecurringInput:
      type: object
      required: [frequency]
      properties:
        frequency:   { type: string, enum: [weekly, fortnightly, monthly, quarterly, annually] }
        startDate:   { type: string, format: date-time, nullable: true }
        occurrences: { type: integer }

    InvoiceInput:
      type: object
      properties:
        customerId:    { type: integer }
        # Staff member credited with the sale (the POS day-staff), so invoice
        # revenue/profit attributes in staff leaderboards + KPIs like POS sales.
        staffId:       { type: integer, nullable: true }
        dueDate:       { type: string, format: date-time }
        notes:         { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLineItem" }
        discount:      { $ref: "#/components/schemas/InvoiceDiscountInput" }
        invoicePrefix: { type: string }
        invoiceDigits: { type: integer }
        recurring:     { $ref: "#/components/schemas/InvoiceRecurringInput" }
        paymentSchedule:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InvoiceInstalment" }
        serviceJobId:  { type: integer, nullable: true }
        appointmentId: { type: integer, nullable: true }

    InvoiceRecurringUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:     { type: boolean }
        frequency:   { type: string }
        startDate:   { type: string, nullable: true }
        occurrences: { type: integer }

    InvoiceUpdate:
      type: object
      properties:
        status:    { type: string, enum: [draft, sent, partial, paid, overdue, cancelled] }
        notes:     { type: string }
        dueDate:
          type: string
          format: date-time
          nullable: true
        customerId:
          type: integer
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLineItem" }
        discount:  { $ref: "#/components/schemas/InvoiceDiscountInput" }
        recurring:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InvoiceRecurringUpdate"
        paymentSchedule:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InvoiceInstalment" }
        serviceJobId:  { type: integer, nullable: true }
        appointmentId: { type: integer, nullable: true }

    GiftCardPaymentRef:
      type: object
      required: [cardId, amount]
      properties:
        cardId: { type: integer }
        amount: { type: number }

    InvoicePaymentInput:
      type: object
      required: [amount]
      properties:
        amount:          { type: number }
        method:          { type: string }
        # Optional split payment: each leg carries its own method + amount and the
        # legs sum to `amount`. When omitted the payment is a single `method`.
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentLeg" }
        giftCardPayment: { $ref: "#/components/schemas/GiftCardPaymentRef" }
        # Optional free-text note recorded against the payment (e.g. "deposit",
        # "cheque #123"). Appended to the recorded payment event's detail.
        note:            { type: string }
        idempotencyKey:  { type: string }
        # Optional accounting date for the settlement. When this payment pays the
        # invoice in full, the invoice's paidAt — and therefore the sale date used
        # by every revenue report (view_daily_sales_summary, payment-method
        # breakdown) — is set to this date instead of "now". Used for payments that
        # actually landed on an earlier day, e.g. a direct deposit / bank transfer.
        # Accepts a plain date (YYYY-MM-DD) or an ISO date-time; must not be in the
        # future. Ignored for partial payments (paidAt is only stamped on full
        # settlement).
        paidAt:          { type: string }

    InvoicePaymentResult:
      allOf:
        - $ref: "#/components/schemas/Invoice"

    # Reverse (or correct) a previously recorded payment. `amount` is the value to
    # un-apply from the invoice's amountPaid; `eventId` optionally targets the
    # specific payment event being reversed (for the activity trail).
    InvoicePaymentReverseInput:
      type: object
      required: [amount]
      properties:
        amount:  { type: number, minimum: 0 }
        eventId: { type: string }
        reason:  { type: string }

    SendInvoiceSmsInput:
      type: object
      properties:
        phone:
          type: string
          description: Optional override number; defaults to the customer's phone on file.
    SendInvoiceEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        template:
          type: object
          description: Optional email template overrides
          properties:
            templateId:         { type: string }
            subjectLine:        { type: string }
            customGreeting:     { type: string }
            customMessage:      { type: string }
            customSignOff:      { type: string }
            footerText:         { type: string }
            thankYouMsg:        { type: string }
            showGstBreakdown:   { type: boolean }
            showWebsite:        { type: boolean }
            showSocialLinks:    { type: boolean }
            showLogo:           { type: boolean }
            brandColor:         { type: string }
            logo:               { type: string }
            website:            { type: string }
            contactEmail:       { type: string }
            tagline:            { type: string }
            socialLinks:
              type: object
              additionalProperties: { type: string }
          additionalProperties: true

    IntegrationActionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, disconnected]

    InvoiceEventInput:
      type: object
      required: [type]
      properties:
        type:           { type: string }
        detail:         { type: string }
        method:         { type: string }
        idempotencyKey: { type: string }

    # ── Quotes ──────────────────────────────────────────────────────────────
    QuoteLineItem:
      type: object
      required: [description, quantity, unitPrice, taxRate]
      properties:
        description: { type: string }
        quantity:    { type: number, minimum: 0.0001 }
        unitPrice:   { type: number, minimum: 0 }
        taxRate:     { type: number, minimum: 0, maximum: 100 }
        # Optional product linkage so a quote converted to a sale carries the
        # productId — letting the POS snapshot cost price like any other sale.
        productId:   { type: integer, nullable: true }
        productName: { type: string, nullable: true }
        costPrice:   { type: number, nullable: true }

    QuoteDiscountInput:
      type: object
      required: [type, value]
      properties:
        type:  { type: string, enum: [fixed, percent] }
        value: { type: number }

    QuoteEvent:
      type: object
      required: [type, timestamp]
      properties:
        type:      { type: string }
        timestamp: { type: string, format: date-time }
        detail:    { type: string, nullable: true }
        method:    { type: string, nullable: true }

    Quote:
      type: object
      required: [id, merchantId, quoteNumber, status, subtotal, taxTotal, total, items, events, createdAt, updatedAt]
      properties:
        id:                     { type: integer }
        merchantId:             { type: integer }
        customerId:             { type: integer, nullable: true }
        serviceJobId:           { type: integer, nullable: true }
        quoteNumber:            { type: string }
        status:                 { type: string, enum: [draft, sent, accepted, declined, expired, converted] }
        subtotal:               { type: number }
        taxTotal:               { type: number }
        total:                  { type: number }
        discountType:           { type: string, nullable: true }
        discountValue:          { type: number, nullable: true }
        discountTotal:          { type: number, nullable: true }
        depositRequired:        { type: number, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuoteLineItem" }
        events:
          type: array
          items: { $ref: "#/components/schemas/QuoteEvent" }
        notes:                  { type: string, nullable: true }
        expiryDate:             { type: string, format: date-time, nullable: true }
        convertedTransactionId: { type: integer, nullable: true }
        customerName:           { type: string, nullable: true }
        customerEmail:          { type: string, nullable: true }
        customerPhone:          { type: string, nullable: true }
        customerAddress:        { type: string, nullable: true }
        customerCompany:        { type: string, nullable: true }
        createdAt:              { type: string, format: date-time }
        updatedAt:              { type: string, format: date-time }

    QuoteList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Quote" }
        total: { type: integer }

    QuoteInput:
      type: object
      properties:
        customerId:  { type: integer }
        serviceJobId: { type: integer, nullable: true }
        expiryDate:  { type: string, format: date-time }
        notes:       { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/QuoteLineItem" }
        discount:    { $ref: "#/components/schemas/QuoteDiscountInput" }
        quotePrefix: { type: string }
        quoteDigits: { type: integer }
        depositRequired: { type: number, nullable: true }

    QuoteUpdate:
      type: object
      properties:
        status:     { type: string, enum: [draft, sent, accepted, declined, expired, converted] }
        notes:      { type: string }
        expiryDate:
          type: string
          format: date-time
          nullable: true
        customerId:
          type: integer
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/QuoteLineItem" }
        discount:   { $ref: "#/components/schemas/QuoteDiscountInput" }
        depositRequired: { type: number, nullable: true }

    ConvertQuoteInput:
      type: object
      properties:
        transactionId: { type: integer }

    SendQuoteEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        template:
          type: object
          description: Optional email template overrides
          additionalProperties: true

    QuoteEventInput:
      type: object
      required: [type]
      properties:
        type:   { type: string }
        detail: { type: string }
        method: { type: string }

    # ── Product Tags ──────────────────────────────────────────────────────────
    ProductTagItem:
      type: object
      required: [name, productCount]
      properties:
        name:         { type: string }
        productCount: { type: integer }

    ProductTagList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductTagItem" }
        total: { type: integer }

    ProductTagRenameInput:
      type: object
      required: [oldName, newName]
      properties:
        oldName: { type: string }
        newName: { type: string }

    ProductTagMergeInput:
      type: object
      required: [sourceTags, targetName]
      properties:
        sourceTags:
          type: array
          items: { type: string }
        targetName: { type: string }

    ProductTagDeleteInput:
      type: object
      required: [name]
      properties:
        name: { type: string }

    ProductTagActionResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }

    # ── Product Variants ──────────────────────────────────────────────────────
    ProductVariant:
      type: object
      required: [id, merchantId, productId, name, stockQuantity, isActive, sortOrder, createdAt]
      properties:
        id:            { type: integer }
        merchantId:    { type: integer }
        productId:     { type: integer }
        name:          { type: string }
        sku:           { type: string, nullable: true }
        barcode:       { type: string, nullable: true }
        price:         { type: number, nullable: true }
        costPrice:     { type: number, nullable: true }
        stockQuantity: { type: integer }
        attributes:
          type: object
          additionalProperties: { type: string }
        imageUrl:      { type: string, nullable: true }
        isActive:      { type: boolean }
        sortOrder:     { type: integer }
        createdAt:     { type: string, format: date-time }

    ProductVariantInput:
      type: object
      required: [name]
      properties:
        name:          { type: string }
        sku:           { type: string }
        barcode:       { type: string }
        price:         { type: number }
        costPrice:     { type: number }
        stockQuantity: { type: integer }
        attributes:
          type: object
          additionalProperties: { type: string }
        imageUrl:      { type: string }
        isActive:      { type: boolean }
        sortOrder:     { type: integer }

    ProductVariantUpdate:
      type: object
      properties:
        name:          { type: string }
        sku:           { type: string, nullable: true }
        barcode:       { type: string, nullable: true }
        price:         { type: number, nullable: true }
        costPrice:     { type: number, nullable: true }
        stockQuantity: { type: integer }
        attributes:
          type: object
          additionalProperties: { type: string }
        imageUrl:      { type: string, nullable: true }
        isActive:      { type: boolean }
        sortOrder:     { type: integer }

    # ── Email Campaigns ───────────────────────────────────────────────────────
    EmailCampaignSendResult:
      type: object
      required: [success, sentAt]
      properties:
        success:  { type: boolean }
        sentAt:   { type: string, format: date-time }
        campaign: { type: object, description: Updated campaign record }

    # ── Xero ──────────────────────────────────────────────────────────────────
    XeroStatus:
      type: object
      required: [connected, configured]
      properties:
        connected:    { type: boolean }
        configured:   { type: boolean }
        tenantId:     { type: string, nullable: true }
        tenantName:   { type: string, nullable: true }
        mappings:     { type: object }
        syncSettings: { type: object }
        syncLog:
          type: array
          items: { $ref: "#/components/schemas/XeroSyncLogEntry" }
        connectedAt:  { type: string, format: date-time, nullable: true }

    XeroTenant:
      type: object
      required: [tenantId, tenantName]
      properties:
        tenantId:   { type: string }
        tenantName: { type: string }
        tenantType: { type: string }

    XeroTenantSelectInput:
      type: object
      required: [tenantId, tenantName]
      properties:
        tenantId:   { type: string }
        tenantName: { type: string }

    XeroAccount:
      type: object
      required: [AccountID, Name, Code, Type]
      properties:
        AccountID:   { type: string }
        Name:        { type: string }
        Code:        { type: string }
        Type:        { type: string }
        Description: { type: string }

    XeroMappings:
      type: object
      required: [mappings, syncSettings]
      properties:
        mappings:
          type: object
          additionalProperties: { type: string }
        syncSettings: { type: object }

    XeroMappingsUpdate:
      type: object
      properties:
        mappings:
          type: object
          additionalProperties: { type: string }
        syncSettings: { type: object }

    SyncContactsInput:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [google_contacts, microsoft_contacts]
          description: Target contact platform
        includeNotes:
          type: boolean
          default: false
          description: When true, CRM notes are mapped to the platform's native notes field
        notesConflict:
          type: string
          enum: [append, overwrite]
          default: append
          description: |
            "append" — all notes concatenated newest-first;
            "overwrite" — only the most-recent note is sent

    SyncContactsResult:
      type: object
      required: [ok, provider, synced, failed, notesSynced, message]
      properties:
        ok:          { type: boolean }
        provider:    { type: string }
        synced:      { type: integer, description: Number of contacts successfully pushed }
        failed:      { type: integer, description: Number of contacts that failed (logged, not fatal) }
        notesSynced: { type: integer, description: Number of contacts whose notes were included }
        message:     { type: string }

    CustomerFilesCloudSettingsInput:
      type: object
      required: [enabled, storageKey, folder]
      properties:
        enabled:
          type: boolean
          description: When true, customer file uploads are mirrored to the cloud
        storageKey:
          type: string
          enum: [onedrive, google_drive, dropbox]
          description: Connected cloud storage provider to mirror files to
        folder:
          type: string
          description: Destination folder path on that provider (set by the platform user)

    CustomerFilesCloudSettings:
      allOf:
        - $ref: "#/components/schemas/CustomerFilesCloudSettingsInput"
        - type: object
          required: [supportedStorageKeys]
          properties:
            supportedStorageKeys:
              type: array
              items: { type: string }
              description: Storage providers that can receive mirrored customer files

    XeroSyncResult:
      type: object
      required: [ok, synced, message]
      properties:
        ok:          { type: boolean }
        synced:      { type: integer }
        notesSynced: { type: integer }
        notesFailed: { type: integer }
        message:     { type: string }

    XeroSyncLogEntry:
      type: object
      required: [type, timestamp]
      properties:
        type:      { type: string }
        timestamp: { type: string, format: date-time }
        synced:    { type: integer }
        message:   { type: string }
        error:     { type: string }

    SecuritySettings:
      type: object
      required: [id, merchantId, anomalyIpThreshold, anomalyWindowMinutes, anomalyHoldHours]
      properties:
        id:                   { type: integer }
        merchantId:           { type: integer }
        anomalyIpThreshold:   { type: integer }
        anomalyWindowMinutes: { type: integer }
        anomalyHoldHours:     { type: integer }

    SecuritySettingsUpdate:
      type: object
      properties:
        anomalyIpThreshold:   { type: integer, minimum: 1, maximum: 100 }
        anomalyWindowMinutes: { type: integer, minimum: 1, maximum: 1440 }
        anomalyHoldHours:     { type: integer, minimum: 1, maximum: 720 }

    # ── Partner Referrals ─────────────────────────────────────────────────────
    PartnerReferral:
      type: object
      required: [id, referredBusinessName, contactName, contactEmail, referredAt, status, bonusEarned]
      properties:
        id:                   { type: integer }
        referredBusinessName: { type: string }
        contactName:          { type: string }
        contactEmail:         { type: string, format: email }
        referredAt:           { type: string, format: date-time }
        status:               { type: string, enum: [pending, trial, active, churned] }
        plan:                 { type: string, nullable: true }
        bonusEarned:          { type: integer }

    PartnerReferralListResponse:
      type: object
      required: [referralCode, referralUrl, referrals]
      properties:
        referralCode: { type: string }
        referralUrl:  { type: string }
        referrals:
          type: array
          items:
            $ref: "#/components/schemas/PartnerReferral"

    CreatePartnerReferralBody:
      type: object
      required: [businessName, contactName, contactEmail]
      properties:
        businessName:  { type: string, minLength: 1 }
        contactName:   { type: string, minLength: 1 }
        contactEmail:  { type: string, format: email }
