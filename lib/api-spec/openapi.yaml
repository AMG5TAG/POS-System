      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Email sent (always 200 to prevent email enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Validation error

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a token received by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid or expired token

  # ── Auth (change credentials) ─────────────────────────────────────────────
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated merchant's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Validation error
        "401":
          description: Current password incorrect

  /auth/change-email:
    post:
      operationId: changeEmail
      tags: [auth]
      summary: Change the authenticated merchant's email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailInput"
      responses:
        "200":
          description: Email changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Validation error
        "401":
          description: Current password incorrect
        "409":
          description: Email already in use

  # ── Account lock ─────────────────────────────────────────────────────────
  /auth/account-lock:
    get:
      operationId: getAccountLockStatus
      tags: [auth]
      summary: Get the lock status of the currently authenticated merchant's account
      responses:
        "200":
          description: Lock status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLockStatus"
        "401":
          description: Unauthorized

    delete:
      operationId: unlockAccount
      tags: [auth]
      summary: Clear any active account lockout (owner only — requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockAccountInput"
      responses:
        "200":
          description: Account unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: currentPassword missing
        "401":
          description: Unauthorized or password incorrect
        "403":
          description: Forbidden — caller is not the account owner

  # ── Security Settings ─────────────────────────────────────────────────────
  /auth/security-settings:
    get:
      operationId: getSecuritySettings
      tags: [auth]
      summary: Get merchant anomaly detection sensitivity settings
      security: [{ session: [] }]
      responses:
