    Layby:
      type: object
      required: [id, reference, totalAmount, depositAmount, amountPaid, balance, status, items, createdAt, updatedAt]
      properties:
        id:            { type: integer }
        reference:     { type: string }
        customerId:    { type: integer, nullable: true }
        customerName:  { type: string, nullable: true }
        staffId:       { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              productId:   { type: integer }
              productName: { type: string }
              quantity:    { type: integer }
              price:       { type: number }
        totalAmount:   { type: number }
        depositAmount: { type: number }
        amountPaid:    { type: number }
        balance:       { type: number }
        status:        { type: string }
        dueDate:       { type: string, nullable: true }
        notes:         { type: string, nullable: true }
        cancelReason:  { type: string, nullable: true }
        completedAt:   { type: string, nullable: true }
        createdAt:     { type: string }
        updatedAt:     { type: string }

    LaybyPayment:
      type: object
      required: [id, laybyId, amount, paymentMethod, createdAt]
      properties:
        id:            { type: integer }
        laybyId:       { type: integer }
        amount:        { type: number }
        paymentMethod: { type: string }
        note:          { type: string, nullable: true }
        createdAt:     { type: string }

    CreateLaybyBody:
      type: object
      required: [items, totalAmount, depositAmount]
      properties:
        customerId:    { type: integer }
        # Staff member credited with the layby (the POS day-staff), so a
        # completed layby attributes revenue in staff leaderboards + KPIs.
        staffId:       { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              productId:   { type: integer }
              productName: { type: string }
              quantity:    { type: integer }
              price:       { type: number }
        totalAmount:   { type: number }
        depositAmount: { type: number }
        dueDate:       { type: string }
        notes:         { type: string }
        paymentMethod: { type: string }

    UpdateLaybyBody:
      type: object
      properties:
        dueDate:  { type: string }
        notes:    { type: string }
        status:   { type: string }

    AddLaybyPaymentBody:
      type: object
      required: [amount]
      properties:
        amount:        { type: number }
        paymentMethod: { type: string }
        # Optional split payment: each leg carries its own method + amount and the
        # legs sum to `amount`. When omitted the payment uses a single `paymentMethod`.
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentLeg" }
        note:          { type: string }
        # Dedupes a retried/double-clicked payment: the same key applied twice
        # records the installment only once. Generated once per payment attempt
        # by the client and reused across manual retries.
        idempotencyKey: { type: string }

    Camera:
      type: object
      required: [id, name, streamUrl, status, sortOrder, createdAt]
      properties:
        id:        { type: integer }
        name:      { type: string }
        streamUrl: { type: string }
        port:      { type: string, nullable: true }
        username:  { type: string, nullable: true }
        password:  { type: string, nullable: true }
        status:    { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    CameraInput:
      type: object
      required: [name, streamUrl]
      properties:
        name:      { type: string }
        streamUrl: { type: string }
        port:      { type: string, nullable: true }
        username:  { type: string, nullable: true }
        password:  { type: string, nullable: true }
        status:    { type: string }
        sortOrder: { type: integer }

    CameraSettings:
      type: object
      required: [pipEnabled, allowedRoles]
      properties:
        pipEnabled:        { type: string }
        pipCameraId:       { type: integer, nullable: true }
