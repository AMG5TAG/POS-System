            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Backup history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          description: Unauthorized
    post:
      operationId: triggerBackup
      tags: [backups]
      summary: Trigger an immediate backup (runs asynchronously)
      responses:
        "202":
          description: Backup accepted and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          description: No encryption password configured
        "401":
          description: Unauthorized

