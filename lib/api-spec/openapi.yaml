          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
    put:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote (status, items, notes, expiry, discount). Only provided fields are applied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /quotes/{id}/pdf:
    get:
      operationId: getQuotePdf
      tags: [quotes]
      summary: Download a branded A4 PDF for a quote
      description: >
        Generates a server-side PDF for the specified quote, incorporating the
        merchant's brand colour and logo from their Business Profile. Returns
        the PDF as an attachment.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
        "404":
          description: Quote not found

  /quotes/{id}/send-email:
    post:
      operationId: sendQuoteEmail
      tags: [quotes]
      summary: Send the quote by email to the customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendQuoteEmailInput"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: Quote not found

